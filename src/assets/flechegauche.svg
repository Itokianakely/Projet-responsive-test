<!-- Fichier : images/flechegauche.svg -->
<!-- fill="none" est le secret pour avoir un fond totalement vide (transparent) -->
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- stroke="currentColor" permet à l'image de prendre la couleur qu'on lui donne en CSS -->
    <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
